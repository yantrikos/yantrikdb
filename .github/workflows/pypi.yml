name: Publish to PyPI and crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: auto
          # macOS Intel (cross-compile on ARM runner)
          - os: macos-14
            target: x86_64-apple-darwin
            manylinux: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # **v0.7.3 hotfix.** ring 0.17.x's pre-generated ARM64
          # assembly files (ghash-neon-armv8, vpaes-armv8, p256-armv8,
          # sha256-armv8, sha512-armv8) `#error` out unless the
          # assembler has __ARM_ARCH defined. cc-rs's manylinux
          # cross-compile toolchain doesn't set the macro by default.
          # `CFLAGS_aarch64_unknown_linux_gnu` is a cc-rs-scoped env
          # var (only consulted when targeting that triple), so it's
          # a no-op on the x86_64/macOS/Windows matrix entries and
          # unblocks the cross-compile cleanly without changing the
          # dependency graph or pinning ring.
          #
          # The first attempt (commit 3825f3d) also set
          # `CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc` but
          # that binary doesn't exist at that path inside the
          # manylinux2014-cross:aarch64 container — the container
          # ships its own cross-toolchain and cc-rs auto-detects it.
          # Setting CC_* overrode the auto-detection and pointed at
          # a non-existent path, breaking the build differently from
          # the original failure. Removed.
          #
          # Diagnosed by yantrikdb-server msg 802c8213 after
          # v0.7.0/0.7.1/0.7.2 all hit the same CI failure.
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8 -march=armv8-a"
        with:
          # **Pinned, not "latest".** Unpinned, the action resolves the
          # newest maturin at run time and fetches it inside the manylinux
          # container. On the v0.14.0 publish that fetch failed twice in a
          # row on x86_64 linux — and only there, because it is the one
          # target built inside Docker. Two different symptoms, seven
          # minutes apart:
          #
          #   attempt 1  curl: (52) Empty reply from server   (0 bytes)
          #   attempt 2  gzip: stdin: not in gzip format      (107 bytes)
          #
          # 107 bytes is an API error body, not a tarball, so the second
          # attempt got a well-formed HTTP response carrying the wrong
          # content. GitHub was fully operational throughout and the
          # release endpoint answered 200 from outside CI, which rules out
          # an outage and points at the run-time resolution itself.
          #
          # Pinning removes that lookup: the version is a constant, so the
          # download is a direct asset URL. It also makes the wheel
          # reproducible — an unpinned build tool silently changes what
          # produced a published artifact.
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # **abi3.** One wheel per platform, not one per interpreter.
          # `pyo3/abi3-py310` links against CPython's stable ABI, so a
          # single `cp310-abi3` wheel runs on 3.10 through 3.14 and every
          # future 3.x — which is also why no `-i` list appears here any
          # more. Building five interpreters produced 25 wheels at ~20 MB
          # a release, and v0.11.1 hit PyPI's 10 GB project limit
          # mid-upload and published a half-release (cp310/cp311 only)
          # that left most users on the previous, broken build.
          args: --release --out dist
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          # Pinned for the same reason as the wheel build above. This job
          # does not run in a container and did not fail, but an unpinned
          # build tool is a moving part in a published artifact either way.
          maturin-version: v1.14.1
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Install the BUILT wheel on the declared Python floor before anything is
  # published. 0.16.0 and 0.17.0 both shipped a 3.11-only import that made
  # `import yantrikdb` fail on 3.10; the build matrix never imported what it
  # built, so nothing stopped the upload. Both registries now depend on this.
  smoke-floor:
    name: Import smoke on the Python floor (3.10)
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install runtime deps from PyPI, then ONLY the built engine from the artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m pip install -U pip
          # Runtime deps come from PyPI (they are not in the artifacts); the
          # engine itself is then installed --no-index --no-deps from this
          # run's wheels only — proof it came from here and nowhere else.
          pip install "uuid-utils>=0.9.0" "click>=8.0.0"
          pip install --no-index --find-links dist --no-deps "yantrikdb==${TAG#v}"
      - name: Import, version == tag, and a one-record round trip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import importlib.metadata as m, os, tempfile
          import yantrikdb
          want = os.environ["TAG"].lstrip("v")
          got = yantrikdb.__version__
          assert got == m.version("yantrikdb") == want, (got, m.version("yantrikdb"), want)
          from yantrikdb import YantrikDB
          db = YantrikDB.with_default(os.path.join(tempfile.mkdtemp(), "smoke.db"))
          rid = db.record_text("floor smoke: the wheel imports and writes on the oldest supported Python")
          row = db.get(rid)  # durable read-back; recall would race the async index
          assert row and "oldest supported Python" in (row.get("text") or ""), row
          print("floor smoke OK:", got)
          PY

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist, smoke-floor]
    environment:
      name: pypi
      url: https://pypi.org/p/yantrikdb
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      # Generate Sigstore/SLSA build provenance attestation for each artifact.
      # Surfaces on PyPI as a verifiable attestation badge and lets downstream
      # consumers prove the wheel came from this specific workflow run. Added
      # 2026-05-13 — donbowman contribution via PR #12.
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # **The irreversible surface must not publish ahead of the recoverable
    # one.** This job used to have no `needs:` at all, while publish-pypi
    # waited on the full wheel matrix. On v0.14.0 one wheel failed to build:
    # publish-pypi was skipped by its own `needs:`, and this job published
    # anyway. The result was a split release — crates.io on 0.14.0, PyPI
    # still on 0.13.4 — and crates.io versions are permanent, so the half
    # that could never be taken back was the half that shipped.
    #
    # Same prerequisites as publish-pypi now, so a wheel failure blocks
    # BOTH registries and the release can be retried as a whole.
    needs: [build-wheels, build-sdist, smoke-floor, publish-pypi]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Idempotent crates.io publish.  Replaces a blanket
      # `continue-on-error: true` that previously swallowed real publish
      # failures (mirrors the yantrikos/yantrikdb-server v0.7.3 silent-failure
      # incident).  exit 0 on success OR if the version is already published;
      # exit non-zero on any other failure so the workflow status surfaces it.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          out="$(cargo publish -p yantrikdb 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [[ $rc -eq 0 ]]; then
            echo "::notice::yantrikdb: published to crates.io"
            exit 0
          fi
          if echo "$out" | grep -qE "already exists on crates\.io"; then
            echo "::notice::yantrikdb: already published at this version (idempotent re-run)"
            exit 0
          fi
          echo "::error::yantrikdb: crates.io publish failed for a non-idempotent reason"
          exit "$rc"

  # yantrikdb.com renders its "Latest releases" block from the GitHub Releases
  # API at build time, but it only rebuilds when something tells it to. This
  # tells it, so the site is current within a minute of a release instead of
  # waiting for its daily cron.
  #
  # NON-FATAL BY CONSTRUCTION. A marketing site that failed to rebuild is not
  # a release failure: no token, no network, no site — this job still exits 0,
  # and the site's own daily rebuild picks the release up.
  notify-site:
    name: Nudge yantrikdb.com to rebuild
    runs-on: ubuntu-latest
    needs: [publish-pypi, publish-crates]
    continue-on-error: true
    steps:
      - name: repository_dispatch to yantrikos/yantrikdb-web
        continue-on-error: true
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN not set - skipping; yantrikdb.com rebuilds daily anyway"
            exit 0
          fi
          curl -sS -f -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $SITE_DISPATCH_TOKEN"             https://api.github.com/repos/yantrikos/yantrikdb-web/dispatches             -d '{"event_type":"component-released","client_payload":{"component":"engine","ref":"${{ github.ref_name }}"}}'             && echo "::notice::yantrikdb.com rebuild requested"             || echo "::warning::dispatch failed - yantrikdb.com will pick this up on its daily rebuild"

name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.target }})${{ matrix.python && format(' [py{0}]', matrix.python) || '' }}
    runs-on: ${{ matrix.os }}
    # Hard cap so a genuine test hang fails fast instead of running until the
    # 24-hour workflow ceiling. (Note: this bounds a job once it STARTS — it
    # does not bound time spent `queued` waiting for a runner, which is why the
    # unschedulable macos-13 entry below was removed rather than merely capped.)
    # 45 min is well above the slowest healthy run (~18 min on Windows).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Linux x86_64 on the OLDEST supported Python (requires-python >=3.10).
          # 0.16.0/0.17.0 shipped a `from datetime import UTC` (3.11+) that this
          # leg would have caught.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python: "3.10"
          # Linux aarch64
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # macOS Apple Silicon — sole macOS runtime coverage.
          - os: macos-14
            target: aarch64-apple-darwin
          # macOS Intel (x86_64-apple-darwin) is intentionally NOT tested here:
          # GitHub's hosted macos-13 Intel runners are deprecated and routinely
          # unschedulable, so the job sat `queued` until the 24-hour workflow
          # ceiling and was cancelled — marking Tests red on EVERY release from
          # v0.7.22 onward (always exactly 24h0m2s). timeout-minutes does not
          # cap queue time, so the only real fix is to not depend on that
          # runner. The x86_64-apple-darwin WHEEL is still built and published
          # via cross-compile on an ARM runner in pypi.yml — that path is
          # unaffected; only the (low-value, vs ARM-mac) Intel test run is gone.

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python || '3.13' }}

      - name: Install maturin and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "maturin>=1.5" pytest pytest-benchmark

      # v0.7.14 (closes #19): yantrikdb-python now includes a build.rs
      # that emits `-undefined dynamic_lookup` on macOS targets, so
      # stock `cargo build` works on macOS without external tooling.
      # No more `--exclude yantrikdb-python` on the build step (still
      # excluded from cargo test below because pyo3 extension-module +
      # cargo test = link error on ALL platforms, since no Python
      # interpreter exists at test-link time).
      - name: Build tests and Rust components
        run: cargo build --workspace --verbose

      # `yantrikdb-python` is a pyo3 extension-module crate — `cargo test`
      # tries to link a test binary against the Python C ABI but
      # `extension-module` feature tells pyo3 NOT to embed the interpreter,
      # so the test binary fails to link with `undefined symbol:
      # PyGILState_Release` and friends. Python tests run via pytest below
      # against the maturin-built wheel, which is the correct surface. So
      # exclude the python crate from cargo test.

      # Slim build path (`--no-default-features`) is a real deployment
      # surface — users who want to BYO their own embedder strip the
      # bundled-embedder + embedder-download Cargo features.
      - name: Run Rust Tests (slim, --no-default-features)
        run: cargo test --workspace --exclude yantrikdb-python --no-default-features --verbose

      - name: Run Rust Tests
        run: cargo test --workspace --exclude yantrikdb-python --verbose

      # The `testing` feature gates the failpoint seam, and every kill proof
      # is `#![cfg(feature = "testing")]`. Without this step they compile out
      # of every CI run and report "ok. 0 passed" — so the three kill proofs
      # cited as proof of the v0.10 write boundaries had never actually run on
      # a PR. A test that never runs is worse than no test: it reports green.
      # Also covers the correction-path unwind failpoints (4a.6a finding 2),
      # which assert the RAII discharge that a killed process would hide —
      # restart repairs a crash, so only a caught, continuing unwind exposes it.
      - name: Run Rust Tests (testing feature — failpoints + kill proofs)
        run: cargo test --workspace --exclude yantrikdb-python --features testing --verbose

      - name: Install Python package
        run: pip install -e ".[all,dev]"

      - name: Run Python Tests
        run: pytest tests/ -v

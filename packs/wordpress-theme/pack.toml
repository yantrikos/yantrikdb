[pack]
name = "wordpress-theme"
version = "0.2.0"
origin = "yantrik/wordpress-theme"
namespace = "wordpress_theme"
description = "A complete design system for WordPress block themes, from activation to premium: the required file set and theme.json token discipline, a worked editorial design system with pairing rules (which fonts, colours and spacing go together), section-level exemplars for heroes, magazine layouts, pullquote and stats bands, galleries and contact sections — plus the composition grammar that took a 27B model to full marks on a rendered-craft benchmark and what is NOT a core block (there is no core/contact-form)."
coverage = [
    "WordPress block theme structure and required files",
    "theme.json settings, styles and generated CSS custom properties",
    "WordPress block markup in templates and template parts",
    "WordPress block patterns and style variations",
    "WordPress theme functions.php, enqueueing and theme supports",
    "CSS for WordPress themes: layout, alignment, specificity",
    "Modern CSS: fluid typography, grid, container queries, cascade layers",
    "WordPress child themes and classic theme structure",
    "premium hero, magazine layout, pullquote and stats sections",
    "WordPress core component blocks: gallery, media-text, columns, search, social links",
]

[content]
# Swept, not guessed. At the old harness default of 5 this pack scored
# differently; at 16 it reaches 20/24 against a 7/24 baseline with the
# unrelated-topic controls intact. Larger k was either no better or cost
# a control point, which is where retrieved context starts displacing
# what the model already knew.
recommended_top_k = 16
memory_type = "procedural"
domain = "engineering"
source = "document"
importance = 0.6
certainty = 0.9

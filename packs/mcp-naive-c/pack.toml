[pack]
name = "mcp-naive-c"
version = "0.1.0"
origin = "yantrik/mcp-naive-c"
namespace = "mcp_naive_c"
description = "Control arm: naive fixed-size chunks of the source document, no curation. Built to measure whether authored records beat chunking at a matched retrieval budget."
coverage = ["control arm, not for publication"]

[content]
# Swept, not guessed. At the old harness default of 5 this pack scored
# differently; at 16 it reaches 37/53 against a 9/53 baseline with the
# unrelated-topic controls intact. Larger k was either no better or cost
# a control point, which is where retrieved context starts displacing
# what the model already knew.
recommended_top_k = 16
memory_type = "semantic"
domain = "engineering"
source = "document"
importance = 0.6
certainty = 0.95

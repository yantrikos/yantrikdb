[pack]
name = "wordpress-expert"
version = "0.2.0"
origin = "yantrik/wordpress-expert"
namespace = "wordpress_expert"
description = "WordPress plugin and theme engineering: the hook system and load order, WP_Query and the options API, REST routes and blocks, WooCommerce data stores, multisite — and the security discipline (sanitize in, escape out, prepare every query, nonce plus capability) that separates code that runs from code that survives a plugin review."
coverage = [
    "WordPress plugin and theme development",
    "WordPress hooks, actions, filters and load order",
    "WordPress security: sanitizing, escaping, nonces, capabilities, prepared queries",
    "WP_Query, options, transients and post meta performance",
    "WordPress REST API routes and permission callbacks",
    "Gutenberg block registration, static versus dynamic blocks",
    "WooCommerce extension through hooks and CRUD data stores",
    "WordPress multisite and WP-Cron",
]

[content]
# Swept, not guessed. At the old harness default of 5 this pack scored
# differently; at 5 it reaches 6/20 against a 1/20 baseline with the
# unrelated-topic controls intact. Larger k was either no better or cost
# a control point, which is where retrieved context starts displacing
# what the model already knew.
recommended_top_k = 4
recommended_min_similarity = 0.6
memory_type = "procedural"
domain = "engineering"
source = "document"
importance = 0.6
certainty = 0.9

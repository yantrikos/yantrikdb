[pack]
name = "agent-memory-discipline"
version = "0.1.0"
origin = "yantrik/agent-memory-discipline"
namespace = "agent_memory_discipline"
description = "Operating rules for an agent working against a persistent memory substrate: which call to reach for, how to band importance, and the traps that silently degrade a memory store over time."
# Tier 3 — coverage index. Author-curated and short: this is read on every
# turn, so it must be phrases a model can hold, not a table of contents.
coverage = [
    "writing and correcting agent memories",
    "choosing between recall, chain-head and correction",
    "importance banding and calibration traps",
]

[content]
# Swept, not guessed. At the old harness default of 5 this pack scored
# differently; at 5 it reaches 9/12 against a 4/12 baseline with the
# unrelated-topic controls intact. Larger k was either no better or cost
# a control point, which is where retrieved context starts displacing
# what the model already knew.
recommended_top_k = 6
recommended_min_similarity = 0.5
memory_type = "procedural"
domain = "operations"
source = "document"
importance = 0.6
certainty = 0.9

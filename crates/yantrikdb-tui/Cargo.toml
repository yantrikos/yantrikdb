[package]
name = "yantrikdb-tui"
version = "0.23.1"
edition = "2021"
license = "Apache-2.0"
description = "Terminal explorer for a YantrikDB store: namespaces, memories, search, claims, revision history, entities, tasks"
repository = "https://github.com/yantrikos/yantrikdb"
keywords = ["ai", "memory", "tui", "database"]
categories = ["command-line-utilities", "database"]
publish = false

[[bin]]
name = "yantrikdb-tui"
path = "src/main.rs"

[dependencies]
# `embedder-download` so a store built with a named model (potion-base-8M,
# 256-d, the default for new stores) can be searched with the SAME model:
# the TUI reads the store's recorded embedder identity and attaches it.
yantrikdb = { path = "../yantrikdb-core", version = "0.23.1", features = ["embedder-download"] }
# Same version and features as the engine so exactly ONE SQLite is linked
# (CONCURRENCY.md rule 9 is about a second library; this is the same one,
# reached through `YantrikDB::conn()`).
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
ratatui = "0.30"
serde_json = "1"
# Random suffix for the exclusively-created snapshot directory.
rand = { version = "0.8", features = ["small_rng"] }

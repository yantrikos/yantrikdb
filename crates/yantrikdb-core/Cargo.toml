[package]
name = "yantrikdb"
version = "0.7.9"
edition = "2021"
license = "AGPL-3.0-only"
description = "Cognitive memory engine for persistent AI systems"
readme = "../../README.md"
repository = "https://github.com/yantrikos/yantrikdb"
keywords = ["ai", "memory", "cognitive", "database", "embeddings"]
categories = ["database", "science"]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
uuid7 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
hex = "0.4"
rand = { version = "0.8", features = ["small_rng"] }
zstd = "0.13"
tracing = "0.1"
aes-gcm = "0.10"
base64 = "0.22"
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
arc-swap = "1"
# DashMap for lock-free per-namespace visible_seq lookups on the recall
# hot path. Phase 6 RYW: visible_seq_for() needs to be O(1) with no
# global lock to avoid contending with concurrent writers.
dashmap = "6"

# **bundled-embedder** dep — pure-Rust static-embedding inference for
# `BundledEmbedder` (saga task 20, rid 019e0686). We disable the
# `default` feature (which is `onig` = oniguruma C lib) and pick
# `fancy-regex` (pure Rust) so we don't re-introduce the kind of
# native-build pain we retired with the no-ONNX rule. The crate's
# tokenizers/http transitive dep is compiled in but never invoked —
# we only call from_pretrained() with local paths against bundled
# weights, never HF Hub IDs.
model2vec-rs = { version = "0.1", default-features = false, features = ["fancy-regex"], optional = true }

# **embedder-download** dep — sync HTTP fetcher for Slice C's
# `set_embedder_named()` runtime-download path. ureq is pure Rust,
# blocking, no async runtime, ~50 KB. Behind its own feature flag so
# slim deployments + WASM targets compile out the network code path
# entirely. `tls-rustls-webpki-roots` so we don't depend on the host
# OS having a usable certificate store (critical for containers).
ureq = { version = "2", default-features = false, features = ["tls", "json"], optional = true }
sha2 = { version = "0.10", optional = true }
dirs = { version = "5", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[features]
# **bundled-embedder** is on by default — the engine ships an Embedder
# impl so `record_text()` / `recall_text()` Just Work without an external
# embedder install or first-run download. Slim deployments compile with
# `--no-default-features` and provide their own embedder via
# `db.set_embedder()`. See saga task 20 + memory rid 019e0686.
default = ["bundled-embedder"]
bundled-embedder = ["dep:model2vec-rs"]
# **Slice C** — runtime download of larger embedder variants from
# `yantrikos/yantrikdb-models` GitHub Releases. Off by default (some
# users prefer fully-offline installs); when on, exposes
# `db.set_embedder_named()`. Builds on `bundled-embedder` because it
# reuses the model2vec-rs loader.
embedder-download = ["bundled-embedder", "dep:ureq", "dep:sha2", "dep:dirs", "dep:tar", "dep:flate2"]
profiling = []

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "engine_bench"
harness = false

[[example]]
name = "profile_recall"
required-features = ["profiling"]
